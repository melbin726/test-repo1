<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo API Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .add-todo {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .add-todo h3 {
            color: #333;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            color: #555;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #4facfe;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            flex: 1;
            margin: 0 10px;
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #333;
        }

        .stat-label {
            color: #666;
            margin-top: 5px;
        }

        .todos {
            margin-top: 30px;
        }

        .todo-item {
            background: #f8f9fa;
            border-left: 4px solid #4facfe;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 0 10px 10px 0;
            transition: transform 0.2s;
        }

        .todo-item:hover {
            transform: translateX(5px);
        }

        .todo-item.completed {
            border-left-color: #28a745;
            opacity: 0.7;
        }

        .todo-title {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .todo-description {
            color: #666;
            margin-bottom: 10px;
        }

        .todo-actions {
            display: flex;
            gap: 10px;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 14px;
        }

        .btn-success {
            background: #28a745;
        }

        .btn-danger {
            background: #dc3545;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .empty-state h3 {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Todo API Demo</h1>
            <p>Your first Java Spring Boot REST API in action!</p>
        </div>

        <div class="content">
            <!-- Add Todo Form -->
            <div class="add-todo">
                <h3>➕ Add New Todo</h3>
                <form id="addTodoForm">
                    <div class="form-group">
                        <label for="title">Title:</label>
                        <input type="text" id="title" name="title" required maxlength="100" 
                               placeholder="Enter todo title...">
                    </div>
                    <div class="form-group">
                        <label for="description">Description:</label>
                        <textarea id="description" name="description" rows="3" maxlength="500"
                                  placeholder="Enter todo description..."></textarea>
                    </div>
                    <button type="submit" class="btn">Add Todo</button>
                </form>
            </div>

            <!-- Statistics -->
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-number" id="totalCount">0</div>
                    <div class="stat-label">Total</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="completedCount">0</div>
                    <div class="stat-label">Completed</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="pendingCount">0</div>
                    <div class="stat-label">Pending</div>
                </div>
            </div>

            <!-- Todos List -->
            <div class="todos">
                <h3>📋 Your Todos</h3>
                <div id="todosList">
                    <div class="empty-state">
                        <h3>No todos yet!</h3>
                        <p>Add your first todo above to get started.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api/todos';

        // Load todos when page loads
        document.addEventListener('DOMContentLoaded', function() {
            loadTodos();
            loadStats();
        });

        // Add todo form submission
        document.getElementById('addTodoForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const title = document.getElementById('title').value;
            const description = document.getElementById('description').value;
            
            try {
                const response = await fetch(API_BASE, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ title, description })
                });
                
                if (response.ok) {
                    document.getElementById('addTodoForm').reset();
                    loadTodos();
                    loadStats();
                } else {
                    alert('Error creating todo');
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        });

        // Load all todos
        async function loadTodos() {
            try {
                const response = await fetch(API_BASE);
                const todos = await response.json();
                
                const todosList = document.getElementById('todosList');
                
                if (todos.length === 0) {
                    todosList.innerHTML = `
                        <div class="empty-state">
                            <h3>No todos yet!</h3>
                            <p>Add your first todo above to get started.</p>
                        </div>
                    `;
                } else {
                    todosList.innerHTML = todos.map(todo => `
                        <div class="todo-item ${todo.completed ? 'completed' : ''}">
                            <div class="todo-title">${todo.title}</div>
                            <div class="todo-description">${todo.description || 'No description'}</div>
                            <div class="todo-actions">
                                ${!todo.completed ? 
                                    `<button class="btn btn-sm btn-success" onclick="completeTodo(${todo.id})">
                                        ✓ Complete
                                    </button>` : 
                                    '<span style="color: #28a745;">✅ Completed</span>'
                                }
                                <button class="btn btn-sm btn-danger" onclick="deleteTodo(${todo.id})">
                                    🗑️ Delete
                                </button>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (error) {
                console.error('Error loading todos:', error);
            }
        }

        // Load statistics
        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE}/stats`);
                const stats = await response.json();
                
                document.getElementById('totalCount').textContent = stats.total;
                document.getElementById('completedCount').textContent = stats.completed;
                document.getElementById('pendingCount').textContent = stats.pending;
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        // Complete a todo
        async function completeTodo(id) {
            try {
                const response = await fetch(`${API_BASE}/${id}/complete`, {
                    method: 'PATCH'
                });
                
                if (response.ok) {
                    loadTodos();
                    loadStats();
                } else {
                    alert('Error completing todo');
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        // Delete a todo
        async function deleteTodo(id) {
            if (confirm('Are you sure you want to delete this todo?')) {
                try {
                    const response = await fetch(`${API_BASE}/${id}`, {
                        method: 'DELETE'
                    });
                    
                    if (response.ok) {
                        loadTodos();
                        loadStats();
                    } else {
                        alert('Error deleting todo');
                    }
                } catch (error) {
                    alert('Error: ' + error.message);
                }
            }
        }
    </script>
</body>
</html>
